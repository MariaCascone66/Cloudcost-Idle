<!-- Delete Modal -->
<div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
        <h3 class="text-xl font-semibold mb-4">Conferma Eliminazione</h3>
        <p class="mb-6">Sei sicuro di voler eliminare la VM <span id="vmName" class="font-bold"></span>?</p>
        <form id="deleteForm" method="post">
            <div class="flex justify-end space-x-4">
                <button type="button" onclick="closeModal('deleteModal')" class="bg-gray-300 px-4 py-2 rounded">Annulla</button>
                <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">Elimina</button>
            </div>
        </form>
    </div>
</div>

<!-- Reactivate Modal -->
<div id="reactivateModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-96">
        <h3 class="text-xl font-semibold mb-4">Conferma Riattivazione</h3>
        <p class="mb-6">Vuoi riattivare la VM <span id="vmNameReactivate" class="font-bold"></span>?</p>
        <form id="reactivateForm" method="post">
            <div class="flex justify-end space-x-4">
                <button type="button" onclick="closeModal('reactivateModal')" class="bg-gray-300 px-4 py-2 rounded">Annulla</button>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Riattiva</button>
            </div>
        </form>
    </div>
</div>
